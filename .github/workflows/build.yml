name: Build

# Windows runners bill double on a private repo, so this avoids work it doesn't
# need: doc-only changes don't run it, a newer push cancels an older run, NUtils
# is built once, and the settings editor (wxWidgets) is only rebuilt when its
# own sources change.

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md' # ships in the artifact, so it does rebuild
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md' # ships in the artifact, so it does rebuild
  workflow_dispatch:
  # release.yml builds a tagged release with this same workflow.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The injected helper DLL needs no extra toolchain.
      - name: Build hook DLL
        run: cargo build --release -p nutils-hook

      # Tests use the plain build: build.rs delay-loads Prism's vendor DLLs for
      # the program only, so a speech-enabled test binary wouldn't start here.
      - name: Test
        run: cargo test --release -p nutils

      # The shipped nutils.exe speaks through Prism (via prismer, linked in
      # statically), which implements NVDA's RPC protocol itself -- so the
      # artifact needs no nvdaControllerClient64.dll beside it.
      # cmake/prism.cmake only chooses backends; prismer matches the CRT.
      - name: Build nutils with Prism speech
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}\cmake\prism.cmake
        run: cargo build --release -p nutils --features speech

      # The settings editor only changes when these files do, so reuse the last
      # built exe when they haven't: the artifact is always complete, and
      # wxWidgets is only touched when the editor really needs rebuilding.
      - name: Reuse settings editor
        id: settings-exe
        uses: actions/cache@v6
        with:
          path: target/release/nutils-settings.exe
          key: settings-exe-${{ runner.os }}-${{ hashFiles('settings/**', 'src/config.rs', 'Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      # Building it compiles wxWidgets from source: needs CMake (preinstalled on
      # the runner), Ninja, and libclang for bindgen. LLVM is preinstalled at
      # C:\Program Files\LLVM.
      - name: Install Ninja
        if: steps.settings-exe.outputs.cache-hit != 'true'
        run: choco install ninja -y

      # Cache the compiled wxWidgets so it isn't rebuilt from source every time
      # (~20 min cold -> a couple of minutes warm). wxdragon-sys writes its CMake
      # output to the dirs named by these env vars; we cache them, keyed on the
      # locked dependency versions. GitHub drops caches unused for 7 days, so the
      # first editor build after a quiet week is cold again.
      - name: Cache wxWidgets build
        if: steps.settings-exe.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .wxbuild
          key: wxwidgets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wxwidgets-${{ runner.os }}-

      - name: Build settings editor
        if: steps.settings-exe.outputs.cache-hit != 'true'
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          WXDRAGON_SYS_BUILD_DIR: ${{ github.workspace }}\.wxbuild\sys
          WXWIDGETS_BUILD_DIR: ${{ github.workspace }}\.wxbuild\wx
        run: cargo build --release -p nutils-settings

      # The GPL and the libraries' own licenses require their notices to travel
      # with the binaries. cargo-about is installed prebuilt (seconds, no compile).
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate third-party notices
        shell: pwsh
        run: ./scripts/notices.ps1 -Out THIRD-PARTY-NOTICES.txt

      # Gather everything into one folder so the zip is flat: the binaries, the
      # README (which doubles as the user guide) and the licenses.
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nutils.exe, target/release/nutils_hook.dll, `
            target/release/nutils-settings.exe, README.md, LICENSE, `
            THIRD-PARTY-NOTICES.txt dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          # Downloads as nutils.zip; each run keeps its own artifact.
          name: nutils
          path: dist/
          if-no-files-found: error

  # The dev update channel: every push to master replaces the rolling `latest`
  # pre-release with this build, zipped and signed like a release (see
  # release.yml). Its notes list the recent commits, newest first, as
  # `- <hash> <subject>`: the updater finds the installed build's commit there
  # and shows what came after it. A pre-release, so stable checks (GitHub's
  # "latest release") never see it.
  dev-release:
    needs: build
    # Not for pull requests, and not when release.yml calls this workflow for a
    # tag (the caller's event and ref apply then).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - uses: actions/download-artifact@v8
        with:
          name: nutils
          path: dist

      - name: Zip
        run: cd dist && zip -9 -r ../nutils.zip .

      - name: Install minisign
        run: |
          gh release download 0.12 -R jedisct1/minisign -p 'minisign-0.12-linux.tar.gz'
          tar -xzf minisign-0.12-linux.tar.gz
          echo "$PWD/minisign-linux/x86_64" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/nutils.key"
          minisign -S -s "$RUNNER_TEMP/nutils.key" -m nutils.zip -t "NUtils dev ${GITHUB_SHA::7}"
          rm "$RUNNER_TEMP/nutils.key"
          public_key=$(grep -oP 'PUBLIC_KEY: &str = "\K[^"]+' settings/src/update.rs)
          minisign -V -P "$public_key" -m nutils.zip

      # Seven-digit hashes, matching what nutils.exe reports (build.rs).
      - name: Release notes
        run: |
          git log -50 --format='%H %s' | awk '{ print "- " substr($1, 1, 7) " " substr($0, 42) }' > notes.md
          cat notes.md

      # The workflow's concurrency cancels this whole run when a newer push
      # comes, this job included. Cancelled between the delete and the create,
      # there's no `latest` release until the newer run publishes one: dev
      # checks fail with "not found" meanwhile, and nothing half-done ships.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest nutils.zip nutils.zip.minisig --prerelease \
            --target "$GITHUB_SHA" --title "NUtils development build" --notes-file notes.md
